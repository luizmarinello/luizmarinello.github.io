<!doctype html>
<!--
  Fonte da imagem de link (og:image). Nao e servida em producao, e so o
  molde de onde sai public/og.png.

  Para regerar: rodar o dev server, abrir http://localhost:5176/og-image.html
  e capturar a janela em exatamente 1200x630.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>og</title>
    <script type="module">
      import '@fontsource-variable/bricolage-grotesque/standard.css'
      import '@fontsource/instrument-serif/400-italic.css'
      import '@fontsource-variable/geist-mono'
    </script>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        display: flex;
        align-items: flex-end;
        padding: 0 72px 64px;
        background-color: #0b1020;
        background-image:
          linear-gradient(rgba(238, 241, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(238, 241, 255, 0.05) 1px, transparent 1px);
        background-size: 72px 72px;
        color: #eef1ff;
        font-family: 'Bricolage Grotesque Variable', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .corner {
        position: absolute;
        width: 26px;
        height: 26px;
        border: 0 solid #eef1ff;
      }
      .tl { top: 28px; left: 28px; border-top-width: 1.5px; border-left-width: 1.5px; }
      .tr { top: 28px; right: 28px; border-top-width: 1.5px; border-right-width: 1.5px; }
      .bl { bottom: 28px; left: 28px; border-bottom-width: 1.5px; border-left-width: 1.5px; }
      .br { bottom: 28px; right: 28px; border-bottom-width: 1.5px; border-right-width: 1.5px; }
      .tag {
        font-family: 'Geist Mono Variable', ui-monospace, monospace;
        font-size: 17px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #5b7cff;
      }
      h1 {
        margin-top: 22px;
        font-size: 118px;
        line-height: 0.92;
        letter-spacing: -0.04em;
        font-weight: 560;
        text-transform: uppercase;
        font-variation-settings: 'opsz' 96;
      }
      h1 span {
        color: #5b7cff;
      }
      p {
        margin-top: 30px;
        font-family: 'Instrument Serif', Georgia, serif;
        font-style: italic;
        font-size: 30px;
        color: #8b95bd;
      }
      .mark {
        position: absolute;
        top: 60px;
        right: 96px;
        width: 250px;
        height: 250px;
      }
    </style>
  </head>
  <body>
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <div>
      <div class="tag">Fig. 01 — Luiz Henrique · Cascavel, PR</div>
      <h1>Backend em Java.<br /><span>IA em produção.</span></h1>
      <p>Plataformas internas em produção, com um modelo de linguagem validado no fluxo.</p>
    </div>

    <!-- a cabeca do robo so em traco, como a peca 3D -->
    <svg class="mark" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#dfe5ff" stroke-width="1.6">
      <circle cx="60" cy="14" r="6" />
      <path d="M60 20v12" />
      <rect x="18" y="32" width="84" height="62" />
      <rect x="34" y="52" width="52" height="18" />
      <path d="M18 60H6m108 0H102" />
      <path d="M42 94v14m36-14v14" />
      <circle cx="60" cy="14" r="2.2" fill="#2b4bff" stroke="none" />
    </svg>
  </body>
</html>
